# Caddy vhosts for the Notesnook sync stack. TLS is automatic.
#
#   notesnook.example.com        two things off one vhost:
#     1. the sync + identity API (Kestrel :5264) on a fixed set of path prefixes
#     2. everything else -> the optional self-hosted web client (static SPA in
#        /opt/notesnook/web), with SPA history-fallback to /index.html
#   auth.notesnook.example.com   -> Identity / OAuth   (Kestrel :8264)
#   events.notesnook.example.com -> SSE push           (Kestrel :7264)
#
# The monograph pages (/share/*) and their unlock assets (/assets/monograph/*,
# /assets/noble/*) are part of (1): the API emits its own per-response CSP for
# those, so do NOT add a vhost CSP to them.
#
# If you are not serving the web client, replace the whole `handle { ... }`
# block with `respond 404` (or drop it) and keep only the `@api` handler.
#
# After editing:  caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

https://notesnook.example.com {
	# 1. sync + identity API  ->  127.0.0.1:5264
	@api {
		path /version /health /api/version
		path /hubs/sync/v2 /hubs/sync/v2/*
		path /share/*
		path /users /users/*
		path /monographs/*
		path /devices /devices/*
		path /announcements /announcements/*
		path /inbox /inbox/*
		path /s3 /s3/*
		path /assets/monograph/* /assets/noble/*
	}
	handle @api {
		reverse_proxy 127.0.0.1:5264 {
			header_up X-Real-IP {remote_host}
			flush_interval -1
		}
	}

	# 2. optional self-hosted Notesnook web client (static SPA)
	handle {
		root * /opt/notesnook/web
		encode zstd gzip

		@spa_assets path /assets/*
		header @spa_assets Cache-Control "public, max-age=31536000, immutable"

		# The SPA compiles wasm (client-side crypto) and spins blob: workers, and
		# talks to the auth + events hosts cross-origin. `data:`/`blob:` in
		# connect-src is required: the compressor wasm is inlined as a data: URI.
		header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: data:; worker-src 'self' blob: data:; child-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' blob: data: https://auth.notesnook.example.com https://events.notesnook.example.com https://cors.notesnook.com https://themes-api.notesnook.com https://subscriptions.streetwriters.co https://issues.streetwriters.co https://notesnook.com https://help.notesnook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'"

		try_files {path} /index.html
		file_server
	}
}

https://auth.notesnook.example.com {
	encode zstd gzip
	reverse_proxy 127.0.0.1:8264 {
		header_up X-Real-IP {remote_host}
	}
}

# SSE / "Events" server. The Notesnook client REQUIRES a valid Events server URL
# (it probes {url}/version for id "sse"). Do NOT compress a text/event-stream:
# buffering it means the client's EventSource never sees the response open.
https://events.notesnook.example.com {
	reverse_proxy 127.0.0.1:7264 {
		header_up -Accept-Encoding
		header_up X-Real-IP {remote_host}
		flush_interval -1
	}
}
