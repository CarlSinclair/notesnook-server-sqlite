# Apache (httpd) vhosts for the Notesnook sync stack.
# Enable: proxy proxy_http proxy_wstunnel rewrite headers  (+ ssl, mpm_event).
#   a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#
#   notesnook.example.com        API (:5264) on a fixed set of prefixes,
#                                everything else -> optional web client SPA
#   auth.notesnook.example.com   -> :8264
#   events.notesnook.example.com -> :7264  (SSE: no buffering)
#
# If you are NOT serving the web client, drop the DocumentRoot + the last
# RewriteRule and add:  RewriteRule ^/ - [R=404,L]

<VirtualHost *:443>
    ServerName notesnook.example.com
    # SSLEngine on
    # SSLCertificateFile    /etc/letsencrypt/live/notesnook.example.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/notesnook.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 0

    # SignalR sync hub (WebSocket) — must come before the generic proxy rules
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/hubs/sync/v2(.*)$ ws://127.0.0.1:5264/hubs/sync/v2$1 [P,L]
    ProxyPass        /hubs/sync/v2 http://127.0.0.1:5264/hubs/sync/v2
    ProxyPassReverse /hubs/sync/v2 http://127.0.0.1:5264/hubs/sync/v2

    # sync + identity API route prefixes -> 127.0.0.1:5264
    <LocationMatch "^/(version|health|api/version|users|monographs|devices|announcements|inbox|s3|share|assets/(monograph|noble))(/|$)">
        ProxyPass        http://127.0.0.1:5264
        ProxyPassReverse http://127.0.0.1:5264
    </LocationMatch>

    # optional self-hosted web client (static SPA)
    DocumentRoot /opt/notesnook/web
    <Directory /opt/notesnook/web>
        Require all granted
        AllowOverride None
    </Directory>
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # SPA history fallback for anything that is not a real file and not the API
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ /index.html [L]
</VirtualHost>

<VirtualHost *:443>
    ServerName auth.notesnook.example.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 0
    ProxyPass        / http://127.0.0.1:8264/
    ProxyPassReverse / http://127.0.0.1:8264/
</VirtualHost>

<VirtualHost *:443>
    ServerName events.notesnook.example.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset Accept-Encoding

    # Server-Sent Events: stream, do not buffer.
    ProxyPass        / http://127.0.0.1:7264/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:7264/
    SetEnv proxy-nokeepalive 0
    SetEnv no-gzip 1
</VirtualHost>
