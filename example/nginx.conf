# nginx vhosts for the Notesnook sync stack. Terminate TLS however you already
# do (certbot, a proxy in front, etc.) — only the proxy_pass wiring is shown.
#
#   notesnook.example.com        API (:5264) on a fixed set of prefixes,
#                                everything else -> optional web client SPA
#   auth.notesnook.example.com   -> :8264
#   events.notesnook.example.com -> :7264  (SSE: no buffering, no gzip)
#
# If you are NOT serving the web client, delete the `location / { ... }` SPA
# block and replace it with `location / { return 404; }`.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notesnook.example.com;

    # ssl_certificate     /etc/letsencrypt/live/notesnook.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/notesnook.example.com/privkey.pem;

    client_max_body_size 512m;

    # --- 1. sync + identity API -> 127.0.0.1:5264 ---------------------------
    # The API's top-level route prefixes. Anything not matched falls through to
    # the SPA block below.
    location ~ ^/(version|health|api/version|users|monographs|devices|announcements|inbox|s3|share|assets/(monograph|noble))(/|$) {
        proxy_pass http://127.0.0.1:5264;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SignalR sync hub (WebSocket)
    location /hubs/sync/v2 {
        proxy_pass http://127.0.0.1:5264;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- 2. optional self-hosted web client (static SPA) ------------------
    root /opt/notesnook/web;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.notesnook.example.com;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8264;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name events.notesnook.example.com;

    # Server-Sent Events: streaming, no buffering, no compression.
    location / {
        proxy_pass http://127.0.0.1:7264;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 1h;
    }
}
